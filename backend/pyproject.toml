[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "llm-model-explorer-backend"
version = "0.1.0"
description = "Local model explorer backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "torch==2.14.0",
  "transformers==4.57.6",
]

[project.scripts]
llm-model-explorer-backend = "llm_model_explorer.cli:main"
llm-model-explorer-validate-architecture = "llm_model_explorer.validate_architecture_cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_model_explorer"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
