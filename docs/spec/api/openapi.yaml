          $ref: '#/components/schemas/ArchitectureId'
        parameter_id:
          $ref: '#/components/schemas/ArchitectureId'
    ArchitectureTemplateInstance:
      type: object
      additionalProperties: false
      required: [node_id, nodes, ports, edges, parameters]
      properties:
        node_id:
          $ref: '#/components/schemas/ArchitectureId'
        nodes:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureTemplateNodeRole'
        ports:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureTemplatePortRole'
        edges:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureTemplateEdgeRole'
        parameters:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureTemplateParameterRole'
    ArchitectureTemplate:
      type: object
