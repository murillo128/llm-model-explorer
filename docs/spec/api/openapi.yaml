          $ref: '#/components/schemas/ArchitectureId'
        node_id:
          $ref: '#/components/schemas/ArchitectureId'
    ArchitectureTemplatePortRole:
      type: object
      additionalProperties: false
      required: [role, node_id, port_id]
      properties:
        role:
          $ref: '#/components/schemas/ArchitectureId'
        node_id:
          $ref: '#/components/schemas/ArchitectureId'
        port_id:
          $ref: '#/components/schemas/ArchitectureId'
    ArchitectureTemplateEdgeRole:
      type: object
      additionalProperties: false
