          quantized: '#/components/schemas/ArchitectureDirectParameter'
          unresolved: '#/components/schemas/ArchitectureDirectParameter'
          alias: '#/components/schemas/ArchitectureAliasParameter'
          fused_region: '#/components/schemas/ArchitectureFusedParameter'
    ArchitectureTemplateNodeRole:
      type: object
      additionalProperties: false
