      properties:
        id:
          $ref: '#/components/schemas/ArchitectureId'
        label:
          $ref: '#/components/schemas/ArchitectureName'
        component_role:
          type: string
          enum: [attention, mlp]
        revision:
          $ref: '#/components/schemas/ArchitectureName'
        provenance:
          type: array
          minItems: 1
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureProvenance'
        instances:
          type: array
          minItems: 2
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureTemplateInstance'
    ArchitectureGraph:
      type: object
      additionalProperties: false
      required:
      - graph_id
      - scope
      - coverage
      - symbols
      - nodes
      - edges
      - repetitions
      - parameters
      - diagnostics
      properties:
        graph_id:
          $ref: '#/components/schemas/ArchitectureId'
        scope:
          type: string
          enum:
          - language_model
          - visual_encoder_predictor
          - model_defined
        coverage:
          type: string
          enum:
          - complete
          - partial
        symbols:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureSymbol'
        nodes:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureNode'
          minItems: 1
        edges:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureEdge'
        repetitions:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureRepetition'
        parameters:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureParameter'
        diagnostics:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureDiagnostic'
        templates:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureTemplate'
    ArchitectureAvailableResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - model_id
      - diagnostics
      - graph
      properties:
        status:
          type: string
          const: available
        model_id:
          type: string
          minLength: 1
        diagnostics:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureDiagnostic'
        graph:
          $ref: '#/components/schemas/ArchitectureGraph'
    ArchitectureUnavailableResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - model_id
      - diagnostics
      - reason
      - requires_restart
      properties:
        status:
          type: string
          const: unavailable
        model_id:
          type: string
          minLength: 1
        diagnostics:
          type: array
          maxItems: 33554432
          items:
            $ref: '#/components/schemas/ArchitectureDiagnostic'
        reason:
          type: string
          enum:
          - unsupported_architecture
          - analysis_failed
          - restart_required
          - unsupported_size
          - cache_unavailable
        requires_restart:
          type: boolean
    ArchitectureResponse:
      oneOf:
      - $ref: '#/components/schemas/ArchitectureAvailableResponse'
      - $ref: '#/components/schemas/ArchitectureUnavailableResponse'
      discriminator:
        propertyName: status
        mapping:
          available: '#/components/schemas/ArchitectureAvailableResponse'
          unavailable: '#/components/schemas/ArchitectureUnavailableResponse'
      description: Prepared static metadata, limited to 33554432 decoded UTF-8 JSON bytes.
        Bound reads and serialization before allocation; overflow yields unavailable/unsupported_size,
        never truncation. Requires graph closure, containment, repetition, alias, dimension
        and session-inventory checks described in architecture-explorer.md. No numerical
        operation is created.
      x-max-decoded-bytes: 33554432

  headers:
    NoStore:
      required: true
      description: Required on all API responses. Shared backend artifact caching is independent.
      schema:
        type: string
        const: no-store
