openapi: 3.1.0
info:
  title: LLM Model Explorer API
  version: current
  description: |
    Current contract between the LLM Model Explorer backend and browser UI.
    The `version` value is OpenAPI document metadata only; the product does not
    expose a public versioned API and backend/UI evolve together against this file.
paths:
  /models:
    get:
      operationId: listModels
      tags: [Models]
      summary: List discovered local models
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelSummary"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
  /sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: Create a session bound to one model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '400':
          $ref: "#/components/responses/BadRequest"
  /sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Retrieve an existing in-memory session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '409':
          $ref: "#/components/responses/ModelChanged"
    delete:
      operationId: deleteSession
      tags: [Sessions]
      summary: Delete a session and release its ephemeral runtime state
      responses:
        "204":
          description: Session deleted; cancels this session's consumers only, preserving other consumers
            and shared artifacts
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
  /sessions/{session_id}/tensors:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listTensors
      tags: [Tensors]
      summary: List tensor descriptors for the session model
      responses:
        "200":
          description: Tensor inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TensorInventory"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '409':
          $ref: "#/components/responses/ModelChanged"
  /sessions/{session_id}/tensors/{tensor_id}/data:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TensorId"
    get:
      operationId: streamTensor
      tags: [Tensors]
      summary: Stream the complete logical float32 tensor
      description: |
        Starts a cancelable long operation. The response body follows
        `binary-streaming.md` with result kind `tensor`.
      responses:
        "200":
          $ref: "#/components/responses/BinaryStream"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '409':
          $ref: "#/components/responses/ModelChanged"
  /sessions/{session_id}/tensors/{tensor_id}/statistics:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TensorId"
    get:
      operationId: streamTensorStatistics
      tags: [Tensors]
      summary: Compute or retrieve reusable statistics for a tensor
      description: |
        Starts a cancelable long operation. The response body follows
        `binary-streaming.md` with result kind `tensor_statistics`.
      responses:
        "200":
          $ref: "#/components/responses/BinaryStream"
        "404":
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '409':
          $ref: "#/components/responses/ModelChanged"
  /sessions/{session_id}/tensors/{tensor_id}/distributions:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TensorId"
    get:
      operationId: streamTensorDistributions
      tags: [Tensors]
      summary: Stream row and column histogram counts for a rank-2 tensor
      description: |
        Starts a cancelable long operation. The response body follows
        `binary-streaming.md` with result kind `tensor_distributions`.
        The proof-of-concept contract uses exactly 100 shared linear bins.
      responses:
        "200":
          $ref: "#/components/responses/BinaryStream"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '409':
          $ref: "#/components/responses/ModelChanged"
  /sessions/{session_id}/tokenize:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: tokenize
      tags: [Tokenizer]
      summary: Tokenize text using the session model tokenizer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenizeRequest"
      responses:
        "200":
          description: Tokenization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenizeResponse"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
        '400':
          $ref: "#/components/responses/BadRequest"
        '409':
          $ref: "#/components/responses/ModelChanged"
  /sessions/{session_id}/embeddings:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: streamInputEmbeddings
      tags: [Embeddings]
      summary: Stream model input embedding rows in token sequence order
      description: |
        Starts a cancelable long operation with LMEX result kind `input_embeddings`.
        Validate all token IDs against the session model vocabulary before META/DATA.
        Return unsupported_representation when a trustworthy input-embedding source
        or its hidden size cannot be resolved. No full vocabulary table transfer or
        eager full-table materialization is required. See contract.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputEmbeddingsRequest"
      responses:
        '200':
          $ref: "#/components/responses/BinaryStream"
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/ModelChanged"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
  /operations/{operation_id}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    delete:
      operationId: cancelOperation
      tags: [Operations]
      summary: Cancel this consumer-visible long operation
      description: |
        Cancellation is idempotent. A request may map internally to shared,
        deduplicated work; cancelling one operation stops only that consumer.
        Shared work may continue while another consumer still requires it.
      responses:
        "204":
          description: Cancellation accepted, already terminal, or ID no longer retained (including unknown
            valid UUIDs)

          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ResourceExhausted"
        '500':
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TensorId:
      name: tensor_id
      in: path
      required: true
      description: Opaque URL-safe tensor identifier returned by the inventory.
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BinaryStream:
      description: Progressive binary long-operation result
      headers:
        X-Operation-Id:
          required: true
          description: Unique identifier for this consumer-visible long operation.
          schema:
            type: string
            format: uuid
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Access-Control-Expose-Headers:
          description: For allowed cross-origin requests, must include X-Operation-Id.
          schema:
            type: string
      content:
        application/vnd.llm-model-explorer.stream:
          schema:
            type: string
            format: binary
    NotFound:
      description: Requested model, session, or tensor was not found
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    enum: [model_not_found, session_not_found, tensor_not_found]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    Unprocessable:
      description: Invalid fields or unsupported representation, rank, size, or uint32 histogram count
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    enum: [validation_error, unsupported_representation, unsupported_rank, unsupported_size]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    BadRequest:
      description: Malformed JSON request body
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    enum: [malformed_json]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    ModelChanged:
      description: Model content differs from the fingerprint pinned by the session
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    enum: [model_content_changed]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    ResourceExhausted:
      description: Insufficient runtime resources
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    enum: [resource_exhausted]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    InternalError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - properties:
                  code:
                    enum: [internal_error]
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
  schemas:
    ModelSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - architectures
        - tokenizer_available
      properties:
        id:
          type: string
          minLength: 1
          description: Stable public logical model identifier. Never a filesystem path.
        display_name:
          type: string
          minLength: 1
        architectures:
          type: array
          items:
            type: string
        model_type:
          type: string
        parameter_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        size_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        tokenizer_available:
          type: boolean

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [model_id]
      properties:
        model_id:
          type: string
          minLength: 1

    Session:
      type: object
      additionalProperties: false
      required: [id, model_id]
      properties:
        id:
          type: string
          format: uuid
        model_id:
          type: string
          minLength: 1

    TensorInventory:
      type: object
      additionalProperties: false
      required: [tensors]
      properties:
        tensors:
          type: array
          items:
            $ref: "#/components/schemas/TensorDescriptor"

    TensorDescriptor:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - path
        - shape
        - rank
        - numel
        - storage_dtype
        - logical_dtype
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque URL-safe identifier used in tensor endpoint paths.
        name:
          type: string
          minLength: 1
          description: Full logical/model tensor name.
        path:
          type: array
          description: Logical name segments used by the UI to build the hierarchy.
          minItems: 1
          items:
            type: string
        shape:
          $ref: "#/components/schemas/TensorShape"
        rank:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        numel:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        storage_dtype:
          type: string
          minLength: 1
          description: Physical dtype/representation reported by the backend.
        storage_format:
          type: string
          description: Optional additional physical format such as a quantization scheme.
        logical_dtype:
          type: string
          enum: [float32]
      description: rank equals shape.length; numel equals product(shape), with product([]) = 1. Validate
        all products before allocation.

    InputEmbeddingsRequest:
      type: object
      additionalProperties: false
      required: [token_ids]
      properties:
        token_ids:
          type: array
          items:
            $ref: "#/components/schemas/SafeInteger"
          description: Ordered IDs from the session tokenizer, including special IDs and duplicates.
      description: Empty input is valid. Every ID must be below the model vocabulary size and
        address a resolved input-embedding row. Booleans and strings are not integer IDs.
        Source-dependent range checks are additional to JSON Schema validation.

    TokenizeRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
        add_special_tokens:
          type: boolean
          default: true

    TokenizeResponse:
      type: object
      additionalProperties: false
      required: [text, add_special_tokens, tokens]
      properties:
        text:
          type: string
        add_special_tokens:
          type: boolean
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"

      description: Exact input echo without normalization. Token indices are consecutive from zero. Present
        spans satisfy 0 <= start <= end <= code-point length(text); spans may overlap.
    Token:
      type: object
      additionalProperties: false
      required: [index, id, token, decoded, special]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        id:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        token:
          type: string
          description: Tokenizer-native token representation.
        decoded:
          type: string
          description: Tokenizer-provided decoded representation; concatenation need not reconstruct input.
        start:
          type: integer
          minimum: 0
          description: Inclusive Unicode code-point index into the exact echoed text; paired with end.
          maximum: 9007199254740991
        end:
          type: integer
          minimum: 0
          description: Exclusive Unicode code-point index into the exact echoed text; paired with start.
          maximum: 9007199254740991
        special:
          type: boolean

          description: True for a tokenizer special ID. Source-typed special IDs may have spans; backend-inserted
            specials have none.
      dependentRequired:
        start: [end]
        end: [start]
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [malformed_json, model_not_found, session_not_found, tensor_not_found, model_content_changed,
            validation_error, unsupported_representation, unsupported_rank, unsupported_size, resource_exhausted,
            internal_error]
        message:
          type: string
          minLength: 1
        details:
          type: object
          additionalProperties: true
      description: Pre-stream JSON error or terminal ERROR_JSON payload. Messages/details must not expose
        filesystem paths or tracebacks. Cancellation uses CANCELLED, not Error.
    SafeInteger:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    TensorShape:
      type: array
      items:
        $ref: "#/components/schemas/SafeInteger"
      description: Generic rank. [] has one element; any zero dimension gives zero elements. Validate
        product and byte length before allocation.
    NullableFiniteNumber:
      type: [number, 'null']
      description: Finite JSON number, or null only when there are no finite source values. NaN and Infinity
        are never JSON numbers.
    TensorMetadata:
      type: object
      additionalProperties: false
      required: [kind, tensor_id, name, shape, dtype, byte_order, layout, byte_length]
      properties:
        kind:
          type: string
          const: tensor
        tensor_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        shape:
          $ref: "#/components/schemas/TensorShape"
        dtype:
          type: string
          const: float32
        byte_order:
          type: string
          const: little
        layout:
          type: string
          const: c
        byte_length:
          $ref: "#/components/schemas/SafeInteger"
      description: LMEX JSON metadata only; byte_length = 4 * product(shape). Numeric values follow as
        binary DATA.
    InputEmbeddingsMetadata:
      type: object
      additionalProperties: false
      required: [kind, token_ids, shape, dtype, byte_order, layout, byte_length]
      properties:
        kind:
          type: string
          const: input_embeddings
        token_ids:
          type: array
          items:
            $ref: "#/components/schemas/SafeInteger"
          description: Exact ordered echo of the submitted token IDs; row i corresponds to token_ids[i].
        shape:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/SafeInteger"
          prefixItems:
            - $ref: "#/components/schemas/SafeInteger"
            - type: integer
              minimum: 1
              maximum: 9007199254740991
        dtype:
          type: string
          const: float32
        byte_order:
          type: string
          const: little
        layout:
          type: string
          const: c
        byte_length:
          $ref: "#/components/schemas/SafeInteger"
      description: Derived matrix, not a named checkpoint tensor. Shape is [token_ids.length,
        hidden_size]; byte_length = 4 * product(shape). Empty input has shape [0, hidden_size]
        and zero DATA bytes. The UTF-8 META payload must fit the existing 1 MiB control-frame
        limit; otherwise return unsupported_size. Numeric matrix values are binary DATA only.
    TensorStatisticsMetadata:
      type: object
      additionalProperties: false
      required: [kind, tensor_id, count, finite_count, non_finite_count, minimum, maximum, mean, stddev,
        percentiles, byte_length]
      properties:
        kind:
          type: string
          const: tensor_statistics
        tensor_id:
          type: string
          minLength: 1
        count:
          $ref: "#/components/schemas/SafeInteger"
        finite_count:
          $ref: "#/components/schemas/SafeInteger"
        non_finite_count:
          $ref: "#/components/schemas/SafeInteger"
        minimum:
          $ref: "#/components/schemas/NullableFiniteNumber"
        maximum:
          $ref: "#/components/schemas/NullableFiniteNumber"
        mean:
          $ref: "#/components/schemas/NullableFiniteNumber"
        stddev:
          $ref: "#/components/schemas/NullableFiniteNumber"
        percentiles:
          type: object
          additionalProperties: false
          required: [p01, p05, p50, p95, p99]
          properties:
            p01:
              $ref: "#/components/schemas/NullableFiniteNumber"
            p05:
              $ref: "#/components/schemas/NullableFiniteNumber"
            p50:
              $ref: "#/components/schemas/NullableFiniteNumber"
            p95:
              $ref: "#/components/schemas/NullableFiniteNumber"
            p99:
              $ref: "#/components/schemas/NullableFiniteNumber"
        byte_length:
          type: integer
          const: 0
      description: count = finite_count + non_finite_count. No DATA frames, including empty DATA. Finite
        fields are all null iff finite_count = 0. See contract.md for numeric semantics.
      allOf:
        - if:
            properties:
              finite_count:
                const: 0
          then:
            properties:
              minimum:
                type: 'null'
              maximum:
                type: 'null'
              mean:
                type: 'null'
              stddev:
                type: 'null'
              percentiles:
                properties:
                  p01:
                    type: 'null'
                  p05:
                    type: 'null'
                  p50:
                    type: 'null'
                  p95:
                    type: 'null'
                  p99:
                    type: 'null'
          else:
            properties:
              minimum:
                type: number
              maximum:
                type: number
              mean:
                type: number
              stddev:
                type: number
                minimum: 0
              percentiles:
                properties:
                  p01:
                    type: number
                  p05:
                    type: number
                  p50:
                    type: number
                  p95:
                    type: number
                  p99:
                    type: number
    DistributionSection:
      type: object
      additionalProperties: false
      required: [name, shape, offset, byte_length]
      properties:
        name:
          type: string
          enum: [row_counts, column_counts]
        shape:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/SafeInteger"
        offset:
          $ref: "#/components/schemas/SafeInteger"
        byte_length:
          $ref: "#/components/schemas/SafeInteger"
      description: C-order uint32 section; byte_length = 4 * product(shape). Offsets refer to concatenated
        DATA, excluding frame headers.
    TensorDistributionsMetadata:
      type: object
      additionalProperties: false
      required: [kind, tensor_id, rows, columns, bin_count, binning, domain_minimum, domain_maximum, dtype,
        byte_order, sections, byte_length]
      properties:
        kind:
          type: string
          const: tensor_distributions
        tensor_id:
          type: string
          minLength: 1
        rows:
          $ref: "#/components/schemas/SafeInteger"
        columns:
          $ref: "#/components/schemas/SafeInteger"
        bin_count:
          type: integer
          const: 100
        binning:
          type: string
          const: linear-full-range
        domain_minimum:
          $ref: "#/components/schemas/NullableFiniteNumber"
        domain_maximum:
          $ref: "#/components/schemas/NullableFiniteNumber"
        dtype:
          type: string
          const: uint32
        byte_order:
          type: string
          const: little
        sections:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - allOf:
                - $ref: "#/components/schemas/DistributionSection"
                - properties:
                    name:
                      const: row_counts
            - allOf:
                - $ref: "#/components/schemas/DistributionSection"
                - properties:
                    name:
                      const: column_counts
          items: false
        byte_length:
          $ref: "#/components/schemas/SafeInteger"
      description: row_counts shape [rows,100], offset 0; column_counts shape [100,columns], offset row
        byte length. Total length is section sum. Both domain endpoints null iff no finite source values;
        counts then all zero. See contract.md.
      allOf:
        - if:
            properties:
              domain_minimum:
                type: 'null'
          then:
            properties:
              domain_maximum:
                type: 'null'
          else:
            properties:
              domain_maximum:
                type: number
    StreamMetadata:
      description: JSON payload of META_JSON; never a JSON encoding of numeric DATA.
      oneOf:
        - $ref: "#/components/schemas/TensorMetadata"
        - $ref: "#/components/schemas/InputEmbeddingsMetadata"
        - $ref: "#/components/schemas/TensorStatisticsMetadata"
        - $ref: "#/components/schemas/TensorDistributionsMetadata"
      discriminator:
        propertyName: kind
        mapping:
          tensor: "#/components/schemas/TensorMetadata"
          input_embeddings: "#/components/schemas/InputEmbeddingsMetadata"
          tensor_statistics: "#/components/schemas/TensorStatisticsMetadata"
          tensor_distributions: "#/components/schemas/TensorDistributionsMetadata"
    StreamProgress:
      type: object
      additionalProperties: false
      required: [completed, unit]
      properties:
        completed:
          $ref: "#/components/schemas/SafeInteger"
        total:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        unit:
          type: string
          minLength: 1
      description: Advisory PROGRESS_JSON payload. When total is present, completed <= total. Does not
        change metadata.
  headers:
    NoStore:
      required: true
      description: Required on all API responses. Shared backend artifact caching is independent.
      schema:
        type: string
        const: no-store
