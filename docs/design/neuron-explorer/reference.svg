<rect x="28" y="116" width="200" height="32" rx="5" class="panel"/><text x="40" y="137" class="muted small">Search components</text><text x="32" y="178" class="label muted">MODEL</text>
<text x="32" y="211">v Model</text><text x="46" y="245">v Decoder layers</text><text x="62" y="279" class="muted">… Layers 0–11</text><text x="62" y="313">v Layer 12</text><text x="80" y="347" class="muted">Attention</text><rect x="28" y="362" width="200" height="34" rx="4" fill="#f3e1c9"/><rect x="28" y="362" width="3" height="34" fill="#c87922"/><text x="80" y="384" class="strong">MLP</text><text x="92" y="418">gate_proj</text><text x="92" y="452">up_proj</text><text x="92" y="486">down_proj</text><text x="62" y="520" class="muted">… Later layers</text>
<path d="M28 548H228" class="line"/><text x="32" y="578" class="label muted">REPETITION WINDOWS</text><text x="32" y="608" class="small muted">Current instance: layer 12</text><text x="32" y="656" class="label muted">SHARED</text><text x="32" y="686" class="small muted">Repeated MLP structure</text>
<text x="32" y="858" class="small muted">Selection uses exact</text><text x="32" y="877" class="small muted">layer and weight bindings.</text>
<rect x="256" y="64" width="664" height="308" rx="9" class="panel"/><path d="M256 104H920" class="line"/><text x="272" y="89" class="strong">Layer 12 / MLP</text><text x="792" y="89" class="small">← Back to graph</text><text x="272" y="129" class="small muted">Selected intermediate coordinate · after gate × up, before down projection</text>
<rect x="280" y="148" width="178" height="56" rx="5" class="panel"/><text x="296" y="171" class="mono">gate_proj</text><text x="296" y="190" class="small muted">row 427</text>
<rect x="280" y="244" width="178" height="56" rx="5" class="panel"/><text x="296" y="267" class="mono">up_proj</text><text x="296" y="286" class="small muted">row 427</text>
<path d="M458 176H480" class="wire" marker-end="url(#arrow)"/><rect x="486" y="156" width="72" height="40" rx="4" class="panel"/><text x="507" y="181" class="small">SiLU</text><path d="M558 176H588V216H610M458 272H588V234H610" class="wire" marker-end="url(#arrow)"/>
<circle cx="632" cy="225" r="22" class="selected"/><text x="623" y="231" style="font-size:23px">×</text><path d="M654 225H708" class="wire" marker-end="url(#arrow)"/>
<text x="610" y="281" class="mono">a[427]</text><rect x="716" y="194" width="178" height="62" rx="5" class="panel"/><text x="730" y="219" class="mono">down_proj</text><text x="730" y="240" class="small muted">column 427</text>
<path d="M272 318H904" class="line"/><text x="272" y="343" class="mono">a[j] = SiLU(g[j]) × u[j]</text><text x="600" y="343" class="small muted">Weights remain read-only.</text>
<rect x="936" y="64" width="488" height="308" rx="9" class="panel"/><path d="M936 104H1424" class="line"/><text x="952" y="89" class="strong">Neuron inspector</text><text x="1304" y="89" class="small muted">Layer 12 · MLP</text>
<text x="952" y="139" class="label muted">INTERMEDIATE INDEX</text><rect x="952" y="151" width="128" height="36" rx="5" class="panel"/><text x="968" y="175" class="mono">427</text><text x="1048" y="175">↕</text><text x="1096" y="174" class="small muted">Concrete instance, zero-based index</text>
<text x="952" y="216" class="label muted">LINKED WEIGHTS</text><text x="952" y="243" class="mono">gate_proj · row 427</text><text x="1340" y="243" class="small">Open ></text><text x="952" y="270" class="mono">up_proj · row 427</text><text x="1340" y="270" class="small">Open ></text><text x="952" y="297" class="mono">down_proj · column 427</text><text x="1340" y="297" class="small">Open ></text>
<path d="M952 316H1408" class="line"/><text x="952" y="342" class="small muted">Interventions modify a[j], never the saved weights.</text>
<rect x="256" y="388" width="1168" height="528" rx="9" class="panel"/><path d="M256 428H1424" class="line"/><text x="272" y="413" class="strong">Experiment</text><text x="384" y="413" class="muted small">Activations</text><text x="488" y="413" class="strong small">Compare</text><path d="M486 427H548" stroke="#c87922" stroke-width="2"/><text x="1275" y="413" class="small">Export configuration</text>
<text x="272" y="455" class="label muted">PROMPT / TOKENS</text><text x="1060" y="455" class="tiny muted">DESIGN REFERENCE · SYNTHETIC DATA</text>
<rect x="272" y="468" width="918" height="58" rx="5" class="panel"/><text x="288" y="492" class="mono">[The][ capital][ of][ France][ is]</text><text x="288" y="513" class="tiny muted">One reusable prompt/tokenizer surface · illustrative tokenization</text>
<rect x="1206" y="468" width="202" height="36" rx="5" fill="#c87922"/><text x="1234" y="491" style="fill:#fff;font-weight:700">Run comparison</text><text x="1220" y="522" class="tiny muted">Greedy · up to 32 new tokens</text>
