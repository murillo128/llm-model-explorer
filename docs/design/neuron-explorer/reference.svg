<rect x="656" y="536" width="124" height="30" rx="4" class="panel"/><text x="669" y="556" class="small">Baseline</text><rect x="792" y="536" width="136" height="30" rx="4" class="panel"/><text x="805" y="556" class="small">Zero · a[j] = 0</text><rect x="940" y="536" width="182" height="30" rx="4" class="selected"/><text x="953" y="556" class="small">Multiply · a[j] × 2.0</text><text x="1154" y="556" class="small muted">+ Add condition</text>
<path d="M272 584H1408" class="line"/><text x="272" y="611" class="strong">Activation on input tokens</text><text x="580" y="611" class="tiny muted">Before intervention</text>
<path d="M306 636V754H750M306 695H750" class="line"/><text x="276" y="640" class="tiny muted">0.8</text><text x="281" y="699" class="tiny muted">0</text><text x="273" y="754" class="tiny muted">−0.8</text><path d="M326 705L425 688L524 711L623 647L722 671" fill="none" stroke="#33332e" stroke-width="2"/><g fill="#33332e"><circle cx="326" cy="705" r="3"/><circle cx="425" cy="688" r="3"/><circle cx="524" cy="711" r="3"/><circle cx="623" cy="647" r="3"/><circle cx="722" cy="671" r="3"/></g>
<text x="312" y="775" class="tiny muted">The</text><text x="404" y="775" class="tiny muted">capital</text><text x="518" y="775" class="tiny muted">of</text><text x="605" y="775" class="tiny muted">France</text><text x="718" y="775" class="tiny muted">is</text><text x="272" y="804" class="small muted">Signed scalar values · selected neuron only</text>
