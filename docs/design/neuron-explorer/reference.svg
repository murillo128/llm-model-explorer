<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<title>LLM Model Explorer — Neuron Explorer design reference</title>
<desc>Proposed light interface integrated into Architecture Explorer. All activations, tokenization and probabilities are illustrative, not measured model outputs.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#20201d;font-size:14px}.muted{fill:#74716b}.small{font-size:12px}.tiny{font-size:11px}.mono{font-family:monospace;font-size:12px}.label{font-size:11px;font-weight:700;letter-spacing:1px}.strong{font-weight:700}.line{stroke:#d7d3ca;stroke-width:1;fill:none}.panel{fill:#fff;stroke:#d7d3ca}.soft{fill:#fbfaf7}.accent{fill:#c87922}.selected{fill:#f3e1c9;stroke:#c87922}.wire{stroke:#74716b;stroke-width:1.5;fill:none}</style><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="none" stroke="#74716b"/></marker></defs>
