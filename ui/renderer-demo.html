<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exact tensor renderer demonstration</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 24px; color: #292928; background: #faf9f6; }
      main { max-width: 900px; }
      #surface { width: 640px; max-width: 100%; height: 260px; background: white; }
      button { margin: 12px 12px 12px 0; padding: 8px 12px; }
      output { display: block; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Exact tensor renderer</h1>
      <p>A generated 512 × 1536 matrix. Each weight occupies one device pixel. Scroll to inspect its native extent.</p>
      <button id="upload">Receive next chunk</button>
      <button id="statistics">Apply p01/p99 statistics</button>
      <button id="retry">Retry after context restoration</button>
      <output id="progress" aria-live="polite"></output>
      <div id="surface"></div>
      <p>Grayscale is weight luminosity; blue-gray cells are pending, magenta cells are nonfinite.</p>
      <p>This standalone demonstration has no backend or React dependency.</p>
    </main>
    <script type="module" src="/src/rendering/demo.ts"></script>
  </body>
</html>
