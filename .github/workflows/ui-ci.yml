name: UI checks

on:
  pull_request:
    # Epic children validate their scoped change locally; the aggregate epic PR runs CI.
    branches-ignore:
      - 'codex/epic-issue-*'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ui:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Typecheck, lint, unit, build and browser
    runs-on: [self-hosted, codex]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation owners from exact revisions
        id: plan
        working-directory: .
        run: python3 .github/scripts/validation_selector.py --github --output validation-plan.json --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.ui == 'true'
        with:
          node-version-file: ui/.nvmrc
      - name: Select isolated browser ports
        if: steps.plan.outputs.ui == 'true'
        shell: bash
        run: |
          base_port=$((20000 + (GITHUB_RUN_ID % 7000) * 6))
          echo "UI_TEST_PORT=$base_port" >> "$GITHUB_ENV"
      - name: Restore locked node_modules
        if: steps.plan.outputs.ui == 'true'
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            ui/node_modules
            ui/scripts/api-generator/node_modules
          key: ui-node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/.nvmrc', 'ui/package.json', 'ui/package-lock.json', 'ui/scripts/api-generator/package.json') }}
      - if: steps.plan.outputs.ui == 'true' && (steps.node-modules.outputs.cache-hit != 'true')
        run: npm ci
      - if: steps.plan.outputs.ui == 'true'
        run: npm run check
      - name: Ensure the locked Chromium build is available
        if: steps.plan.outputs.ui == 'true'
        run: npx playwright install chromium
      - name: Run browser tests
        if: steps.plan.outputs.ui == 'true'
        shell: bash
        run: |
          browser_args=()
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            browser_args=(--main)
          fi
          python3 ../.github/scripts/validation_selector.py --plan ../validation-plan.json --run browser "${browser_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-evidence
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 14
