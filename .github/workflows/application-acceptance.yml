name: Application acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'ui/**'
      - 'api/**'
      - 'acceptance/**'
      - '.github/workflows/application-acceptance.yml'
  push:
    branches: [main, 'codex/epic-issue-*']
    paths:
      - 'backend/**'
      - 'ui/**'
      - 'api/**'
      - 'acceptance/**'
      - '.github/workflows/application-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Contract, backend, UI and real product acceptance
    runs-on: [self-hosted, codex]
    concurrency:
      group: application-acceptance-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    timeout-minutes: 25
    env:
      LMEX_EVIDENCE_DIR: /tmp/lmex-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
      - name: Select isolated browser ports
        shell: bash
        run: |
          base_port=$((20000 + (GITHUB_RUN_ID % 7000) * 6))
          echo "UI_TEST_PORT=$base_port" >> "$GITHUB_ENV"
      - name: Reuse persistent backend environment
        shell: bash
        run: |
          env_dir="${{ runner.tool_cache }}/llm-model-explorer/application/backend-python-3.12-${{ hashFiles('backend/uv.lock') }}"
          echo "UV_PROJECT_ENVIRONMENT=$env_dir" >> "$GITHUB_ENV"
          ln -s "$env_dir" backend/.venv
      - run: uv sync --locked --project backend --python 3.12
      - name: Reuse persistent API environment
        shell: bash
        run: |
          env_dir="${{ runner.tool_cache }}/llm-model-explorer/application/api-python-3.12-${{ hashFiles('api/requirements.txt') }}"
          if [ ! -x "$env_dir/bin/python" ]; then
            uv venv "$env_dir" --python 3.12
          fi
          uv pip install --python "$env_dir/bin/python" -r api/requirements.txt
          echo "LMEX_CONTRACT_PYTHON=$env_dir/bin/python" >> "$GITHUB_ENV"
      - name: Restore locked node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            ui/node_modules
            ui/scripts/api-generator/node_modules
          key: ui-node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/.nvmrc', 'ui/package.json', 'ui/package-lock.json', 'ui/scripts/api-generator/package.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix ui
      - name: Ensure the locked Chromium build is available
        run: cd ui && npx playwright install chromium
      - name: Run application acceptance
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            bash acceptance/check.sh
          else
            bash acceptance/check-integration.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-acceptance-evidence
          path: |
            ${{ env.LMEX_EVIDENCE_DIR }}/
            ui/test-results/
          retention-days: 14
