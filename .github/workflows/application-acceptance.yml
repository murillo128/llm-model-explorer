name: Application acceptance

on:
  pull_request:
    # Epic children validate their scoped change locally; the aggregate epic PR runs acceptance.
    branches-ignore:
      - 'codex/epic-issue-*'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Contract, backend, UI and real product acceptance
    runs-on: [self-hosted, codex]
    concurrency:
      group: application-acceptance-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    timeout-minutes: 25
    env:
      LMEX_EVIDENCE_DIR: /tmp/lmex-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation owners from exact revisions
        id: plan
        working-directory: .
        run: python3 .github/scripts/validation_selector.py --github --output validation-plan.json --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.integration == 'true'
        with:
          version: '0.12.13'
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.integration == 'true'
        with:
          node-version-file: ui/.nvmrc
      - name: Select isolated browser ports
        if: steps.plan.outputs.integration == 'true'
        shell: bash
        run: |
          base_port=$((20000 + (GITHUB_RUN_ID % 7000) * 6))
          echo "UI_TEST_PORT=$base_port" >> "$GITHUB_ENV"
      - name: Reuse persistent backend environment
        if: steps.plan.outputs.integration == 'true'
        shell: bash
        run: |
          env_dir="${{ runner.tool_cache }}/llm-model-explorer/application/backend-python-3.12-${{ hashFiles('backend/uv.lock') }}"
          echo "UV_PROJECT_ENVIRONMENT=$env_dir" >> "$GITHUB_ENV"
          ln -s "$env_dir" backend/.venv
      - if: steps.plan.outputs.integration == 'true'
        run: uv sync --locked --project backend --python 3.12
      - name: Reuse persistent API environment
        if: steps.plan.outputs.integration == 'true' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          env_dir="${{ runner.tool_cache }}/llm-model-explorer/application/api-python-3.12-${{ hashFiles('api/requirements.txt') }}"
          if [ ! -x "$env_dir/bin/python" ]; then
            uv venv "$env_dir" --python 3.12
          fi
          uv pip install --python "$env_dir/bin/python" -r api/requirements.txt
          echo "LMEX_CONTRACT_PYTHON=$env_dir/bin/python" >> "$GITHUB_ENV"
      - name: Restore locked node_modules
        if: steps.plan.outputs.integration == 'true'
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            ui/node_modules
            ui/scripts/api-generator/node_modules
          key: ui-node-modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/.nvmrc', 'ui/package.json', 'ui/package-lock.json', 'ui/scripts/api-generator/package.json') }}
      - if: steps.plan.outputs.integration == 'true' && (steps.node-modules.outputs.cache-hit != 'true')
        run: npm ci --prefix ui
      - name: Ensure the locked Chromium build is available
        if: steps.plan.outputs.integration == 'true'
        run: cd ui && npx playwright install chromium
      - name: Run application acceptance
        if: steps.plan.outputs.integration == 'true'
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Component/API checks belong to their dedicated workflows.
            bash acceptance/check-integration.sh --main-ci --plan validation-plan.json
          else
            bash acceptance/check-integration.sh --plan validation-plan.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-acceptance-evidence
          path: |
            ${{ env.LMEX_EVIDENCE_DIR }}/
            ui/test-results/
          retention-days: 14
