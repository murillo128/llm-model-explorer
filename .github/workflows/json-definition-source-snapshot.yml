name: Prepare model-owned JSON feature
on:
  push:
    branches: [chore/json-definition-source-snapshot]
permissions:
  contents: write
concurrency:
  group: model-owned-json-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: [self-hosted, codex]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: support
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feat/model-owned-architecture-json
          path: target
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: target/ui/.nvmrc
      - name: Apply scoped patch, generate and validate
        shell: bash
        run: bash support/.transfer/prepare.sh
      - name: Capture source-only preparation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/model-json-preparation"
          cd target
          git diff HEAD --binary > "$RUNNER_TEMP/model-json-preparation/worktree.patch"
          git status --short > "$RUNNER_TEMP/model-json-preparation/status.txt"
          if [ -f "$RUNNER_TEMP/published-head.txt" ]; then
            cp "$RUNNER_TEMP/published-head.txt" "$RUNNER_TEMP/model-json-preparation/"
          fi
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/model-json-preparation/source.tar.gz" --ignore-failed-read
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-json-preparation
          path: ${{ runner.temp }}/model-json-preparation/
          retention-days: 1
