name: Temporary tracked source snapshot
on:
  push:
    branches: [chore/json-definition-source-snapshot]
permissions:
  contents: read
jobs:
  source:
    runs-on: [self-hosted, codex]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked repository files only
        run: git archive --format=zip --output=tracked-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tracked-source
          path: tracked-source.zip
          retention-days: 1
