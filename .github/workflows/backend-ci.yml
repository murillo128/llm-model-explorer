name: Backend checks

on:
  pull_request:
    # Epic children validate their scoped change locally; the aggregate epic PR runs CI.
    branches-ignore:
      - 'codex/epic-issue-*'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, codex]
    strategy:
      matrix:
        python: ${{ github.ref == 'refs/heads/main' && fromJSON('["3.12","3.14"]') || fromJSON('["3.12"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation owners from exact revisions
        id: plan
        working-directory: .
        run: python3 .github/scripts/validation_selector.py --github --output validation-plan.json --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.backend == 'true'
        with:
          version: '0.12.13'
      - name: Select persistent Python environment
        if: steps.plan.outputs.backend == 'true'
        shell: bash
        run: echo "UV_PROJECT_ENVIRONMENT=${{ runner.tool_cache }}/llm-model-explorer/backend/python-${{ matrix.python }}-${{ hashFiles('backend/uv.lock') }}" >> "$GITHUB_ENV"
      - if: steps.plan.outputs.backend == 'true'
        run: uv sync --locked --python '${{ matrix.python }}'
      - if: steps.plan.outputs.backend == 'true' && matrix.python == '3.12'
        run: uv run --locked ruff check .
      - if: steps.plan.outputs.backend == 'true' && matrix.python == '3.12'
        run: uv run --locked ruff format --check .
      - if: steps.plan.outputs.backend == 'true' && matrix.python == '3.12'
        run: uv run --locked mypy
      - name: Run selected primary backend portfolio
        if: steps.plan.outputs.backend == 'true' && matrix.python == '3.12'
        run: |
          selected=$(python3 ../.github/scripts/validation_selector.py --plan ../validation-plan.json --backend-targets)
          mapfile -t tests <<< "$selected"
          if [ "${{ steps.plan.outputs.portfolio }}" = full ]; then
            uv run --locked pytest "${tests[@]}" --durations=25
          else
            uv run --locked pytest "${tests[@]}" -m 'not extended' --durations=25
            # Only tensor-analysis owns threshold/allocator checks today.
            if [ "${{ steps.plan.outputs.backend_extended }}" = true ]; then
              uv run --locked pytest tests/test_tensor_analysis.py -m extended --durations=10
            fi
          fi
      - name: Build and smoke-test the installed wheel outside the source tree
        if: steps.plan.outputs.backend == 'true'
        run: |
          wheel_args=()
          if [ "${{ matrix.python }}" = 3.14 ] && [ "${{ steps.plan.outputs.compatibility_full }}" = true ]; then
            wheel_args=(--full)
          fi
          bash ../acceptance/check-wheel.sh "${UV_PROJECT_ENVIRONMENT}/bin/python" "${wheel_args[@]}"
