name: Validate API contract

on:
  pull_request:
    # Epic children validate their scoped change locally; the aggregate epic PR runs CI.
    branches-ignore:
      - 'codex/epic-issue-*'
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select validation owners from exact revisions
        id: plan
        working-directory: .
        run: python3 .github/scripts/validation_selector.py --github --output validation-plan.json --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.api == 'true'
        with:
          version: '0.12.13'
      - name: Reuse persistent API environment
        if: steps.plan.outputs.api == 'true'
        shell: bash
        run: |
          env_dir="${{ runner.tool_cache }}/llm-model-explorer/api-contract/python-3.12-${{ hashFiles('api/requirements.txt') }}"
          if [ ! -x "$env_dir/bin/python" ]; then
            uv venv "$env_dir" --python 3.12
          fi
          uv pip install --python "$env_dir/bin/python" -r api/requirements.txt
          echo "LMEX_API_PYTHON=$env_dir/bin/python" >> "$GITHUB_ENV"
      - if: steps.plan.outputs.api == 'true'
        run: '"$LMEX_API_PYTHON" api/validate_contract.py'
      - if: steps.plan.outputs.api == 'true'
        run: '"$LMEX_API_PYTHON" api/validate_contract.py --write'
      - if: steps.plan.outputs.api == 'true'
        run: git diff --exit-code -- api/fixtures
