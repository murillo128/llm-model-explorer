name: Validate API contract

on:
  pull_request:
    paths:
      - 'docs/spec/api/**'
      - 'api/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches:
      - main
      - 'codex/issue-*'
      - 'codex/epic-issue-*'
    paths:
      - 'docs/spec/api/**'
      - 'api/**'
      - '.github/workflows/api-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r api/requirements.txt
      - run: python api/validate_contract.py
      - run: python api/validate_contract.py --write
      - run: git diff --exit-code -- api/fixtures
