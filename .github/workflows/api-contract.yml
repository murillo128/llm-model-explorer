name: Validate API contract

on:
  pull_request:
    # Epic children validate their scoped change locally; the aggregate epic PR runs CI.
    branches-ignore:
      - 'codex/epic-issue-*'
    paths:
      - 'docs/spec/api/**'
      - 'api/**'
      - '.github/workflows/api-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/spec/api/**'
      - 'api/**'
      - '.github/workflows/api-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - name: Reuse persistent API environment
        shell: bash
        run: |
          env_dir="${{ runner.tool_cache }}/llm-model-explorer/api-contract/python-3.12-${{ hashFiles('api/requirements.txt') }}"
          if [ ! -x "$env_dir/bin/python" ]; then
            uv venv "$env_dir" --python 3.12
          fi
          uv pip install --python "$env_dir/bin/python" -r api/requirements.txt
          echo "LMEX_API_PYTHON=$env_dir/bin/python" >> "$GITHUB_ENV"
      - run: '"$LMEX_API_PYTHON" api/validate_contract.py'
      - run: '"$LMEX_API_PYTHON" api/validate_contract.py --write'
      - run: git diff --exit-code -- api/fixtures
